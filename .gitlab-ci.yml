stages:
  - quality
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

quality:
  stage: quality
  image: python:3.12-slim
  script:
    - pip install -e ".[dev]"
    - ruff check .
    - ruff format --check .
    - mypy

unit_test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -e ".[dev]"
    - pytest --cov --cov-report=term-missing --cov-report=xml
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

container_build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -f deployment/docker/Dockerfile -t enterprise-ai-platform:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH
