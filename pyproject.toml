[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "enterprise-ai-platform"
version = "0.1.0"
description = "Reference implementation for secure, observable enterprise agentic AI applications."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "William Hartono" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "structlog>=25.1,<26.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/enterprise_ai_api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["enterprise_ai_api"]
mypy_path = "apps/api/src"

[tool.coverage.run]
source = ["apps/api/src/enterprise_ai_api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
